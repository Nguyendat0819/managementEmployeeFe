<div class="modal-backdrop" (click)="cancel.emit()">
  <section class="department-modal" role="dialog" aria-modal="true" aria-labelledby="org-unit-form-title" (click)="$event.stopPropagation()">
    <div class="modal-heading">
      <div>
        <span class="modal-eyebrow">departments</span>
        <h2 id="org-unit-form-title">{{ title }}</h2>
        <p>{{ description }}</p>
      </div>
      <button type="button" class="modal-close" aria-label="Đóng" (click)="cancel.emit()">×</button>
    </div>

    <form #departmentForm="ngForm" (ngSubmit)="submit(departmentForm.valid)" class="department-form">
      <div class="form-grid">
        <label class="form-field">
          <span>Mã tổ chức <b>*</b></span>
          <input name="deptCode" [(ngModel)]="form.deptCode" required maxlength="255" [readonly]="identityFieldsReadOnly" placeholder="VD: IT" />
        </label>
        <label class="form-field">
          <span>Mã đơn vị cha</span>
          <input name="parentCode" [(ngModel)]="form.parentCode" maxlength="255" [readonly]="parentCodeReadOnly" placeholder="VD: BLOCK-01" />
        </label>
        <label class="form-field form-field-wide">
          <span>Tên đơn vị <b>*</b></span>
          <input name="name" [(ngModel)]="form.name" required maxlength="200" [readonly]="fieldsReadOnly" placeholder="Tên đơn vị" />
        </label>
        <label class="form-field">
          <span>Mã đơn vị <b>*</b></span>
          <input name="code" [(ngModel)]="form.code" required maxlength="20" [readonly]="identityFieldsReadOnly" placeholder="Mã đơn vị" />
        </label>
        <label class="form-field">
          <span>Mã người phụ trách</span>
          <ss-select
            name="headCode"
            [(ngModel)]="form.headCode"
            [options]="employeeOptions"
            [loading]="employeeLoading"
            [showSearch]="true"
            [allowClear]="true"
            [disabled]="identityFieldsReadOnly"
            placeholder="Chọn nhân viên"
          ></ss-select>
        </label>
        <label class="form-field">
          <span>Cấp <b>*</b></span>
          <input name="level" type="number" [(ngModel)]="form.level" required min="1" max="10" [readonly]="fieldsReadOnly" />
        </label>
      </div>

      <div class="form-error" *ngIf="formError">{{ formError }}</div>

      <div class="modal-actions">
        <button type="button" class="modal-secondary" (click)="cancel.emit()">Đóng</button>
        <button *ngIf="!readOnly" type="submit" class="modal-primary" [disabled]="departmentForm.invalid">
          {{ mode === 'edit' ? 'Lưu thay đổi' : mode === 'relocate' ? 'Chuyển đơn vị' : 'Lưu' }}
        </button>
      </div>
    </form>
  </section>
</div>
