<div class="org-unit-list-page">
  <ss-tree-table
    [nodes]="nodes"
    [columns]="columns"
    [config]="config"
    [loading]="loading"
    (toolbarAction)="onToolbarAction($event)"
    (actionClick)="onActionClick($event)"
    (queryChange)="onQueryChange($event)"
  ></ss-tree-table>

  <app-org-unit-form
    *ngIf="formOpen"
    [mode]="formMode"
    [department]="formDepartment"
    [parentDepartment]="formParentDepartment"
    [saving]="saving"
    (cancel)="closeForm()"
    (save)="onFormSave($event)"
  ></app-org-unit-form>

  <div class="employee-modal-backdrop" *ngIf="employeesOpen" (click)="closeEmployees()">
    <section class="employee-modal" role="dialog" aria-modal="true" (click)="$event.stopPropagation()">
      <div class="employee-modal-heading">
        <div>
          <span class="employee-modal-eyebrow">employees</span>
          <h2>Nhân sự - {{ employeesDepartment?.name }}</h2>
          <p>{{ employeesDepartment?.deptCode }}</p>
        </div>
        <button type="button" class="employee-modal-close" aria-label="Đóng" (click)="closeEmployees()">×</button>
      </div>

      <div class="employee-list-content">
        <p *ngIf="employeesLoading">Đang tải danh sách nhân sự...</p>
        <p *ngIf="!employeesLoading && !employees.length">Phòng ban chưa có nhân sự.</p>
        <div class="employee-table-wrapper" *ngIf="!employeesLoading && employees.length">
          <table class="employee-table">
            <thead>
              <tr>
                <th>Mã nhân viên</th>
                <th>Họ và tên</th>
                <th>Email</th>
                <th>Trạng thái</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let employee of employees">
                <td>{{ employee.employeeCode }}</td>
                <td>{{ employee.fullName }}</td>
                <td>{{ employee.email || '—' }}</td>
                <td>{{ employee.status }}</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>
  </div>
</div>
